name: Bebfy Frontend CI
on:
  push:
    branches: [main, refactor/conexao-backend-chatgpt]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: TypeScript and Vite build
        run: npm run build
