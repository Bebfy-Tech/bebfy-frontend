name: Update frontend dependency lock once
on:
  push:
    branches: [refactor/conexao-backend-chatgpt]
    paths: ['.github/workflows/refresh-lock-once.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/conexao-backend-chatgpt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync frontend lockfile with TS6 dependency"
            git push origin HEAD:refactor/conexao-backend-chatgpt
          fi
